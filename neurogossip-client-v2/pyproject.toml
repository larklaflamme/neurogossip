[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurogossip-client"
version = "0.1.0"
description = "Redis Streams + Pub/Sub client for reliable multi-turn AI-agent discussions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neurogossip Contributors" }]
keywords = ["neurogossip", "redis", "pubsub", "agents", "messaging", "llm", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
]
dependencies = [
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.20.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
neurogossip = "neurogossip_client.cli:app"

[project.urls]
Homepage = "https://github.com/neurogossip/neurogossip"

[tool.hatch.build.targets.wheel]
packages = ["src/neurogossip_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]