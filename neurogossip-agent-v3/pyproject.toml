[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurogossip-agent"
version = "0.1.0"
description = "Conversational session management client library for AI agents using Redis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neurogossip Contributors" }]
keywords = ["neurogossip", "redis", "pubsub", "agents", "messaging", "llm", "multi-agent", "session-management"]
dependencies = [
    "redis>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.20.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neurogossip_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
